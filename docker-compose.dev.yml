# Local Development Docker Compose Environment
#
# Usage:
#   make dev (starts postgres container and backend API server on :8055)
#   cd frontend && ./gradlew wasmJsBrowserRun (optional standalone dev server on :8080)
#
# CORS is configured to allow requests from http://localhost:8080 during local development.

services:
  postgres:
    image: postgres:17-alpine
    container_name: inframap-dev-postgres
    restart: always
    environment:
      POSTGRES_DB: inframap
      POSTGRES_USER: inframap
      POSTGRES_PASSWORD: inframap_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inframap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
