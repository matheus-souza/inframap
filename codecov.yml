# Codecov Configuration for InfraMap Engine
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: 85%

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

ignore:
  - "backend/migrations/**"
  - "backend/internal/platform/db/**"
  - "backend/internal/bootstrap/**"
  - "backend/cmd/**"
  - "backend/scripts/**"
  - "**/*.sql.go"
  - "**/*_mock.go"
  - "**/mock_*.go"
  - "backend/modules/*/repository/*_repository.go"
  - "frontend/src/wasmJsMain/kotlin/**/Main.kt"
  - "frontend/src/commonMain/kotlin/**/designsystem/**"
  - "frontend/src/commonMain/kotlin/**/data/dto/**"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
