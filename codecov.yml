# Codecov Configuration for InfraMap Engine
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: 85%
        threshold: 0%
    patch:
      default:
        target: 85%

ignore:
  - "backend/migrations/**"
  - "backend/internal/platform/db/**"
  - "backend/internal/bootstrap/**"
  - "backend/cmd/**"
  - "backend/scripts/**"
  - "**/*_mock.go"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
