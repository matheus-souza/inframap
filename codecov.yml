# Codecov Configuration for InfraMap Engine
codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 2
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 85%

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

ignore:
  - "backend/migrations/**"
  - "backend/internal/platform/db/**"
  - "backend/internal/bootstrap/**"
  - "backend/cmd/**"
  - "backend/scripts/**"
  - "**/*.sql.go"
  - "**/*_mock.go"
  - "**/mock_*.go"
  - "backend/modules/*/repository/*_repository.go"
  - "**/Main.kt"
  - "**/designsystem/**"
  - "**/data/dto/**"
  - "**/ui/app/**"
  - "**/SplashScreen.kt"
  - "**/LoginScreen.kt"
  - "**/OnboardingScreen.kt"
  - "**/DashboardScreen.kt"
  - "**/MainScaffold.kt"
  - "**/InfraMapApp.kt"
  - "**/BrowserSSEClient.kt"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
