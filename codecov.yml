# Codecov Configuration for InfraMap Engine
codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 2
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 85%
        threshold: 3%

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

ignore:
  - "backend/migrations/**"
  - "backend/internal/platform/db/**"
  - "backend/internal/bootstrap/**"
  - "backend/cmd/**"
  - "backend/scripts/**"
  - "**/*.sql.go"
  - "**/*_mock.go"
  - "**/mock_*.go"
  - "backend/modules/*/repository/*_repository.go"
  - "frontend/src/wasmJsMain/**"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/generated/**"
  - "**/generated/**"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/designsystem/**"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/data/dto/**"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/app/**"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/splash/SplashScreen.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/login/LoginScreen.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/onboarding/OnboardingScreen.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/dashboard/DashboardScreen.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/devices/DeviceListScreen.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/devices/DeviceDetailScreen.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/devices/CreateDeviceScreen.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/devices/EditDeviceScreen.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/staging/StagingScreen.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/subnets/SubnetsScreen.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/subnets/CreateSubnetScreen.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/topology/TopologyScreen.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/ui/topology/components/**"
  - "**/DashboardScreen.kt"
  - "**/DeviceListScreen.kt"
  - "**/DeviceDetailScreen.kt"
  - "**/CreateDeviceScreen.kt"
  - "**/EditDeviceScreen.kt"
  - "**/StagingScreen.kt"
  - "**/SubnetsScreen.kt"
  - "**/CreateSubnetScreen.kt"
  - "**/MainScaffold.kt"
  - "**/InfraMapApp.kt"
  - "**/BrowserSSEClient.kt"
  - "**/*Contracts.kt"
  - "**/Route.kt"
  - "frontend/src/commonMain/kotlin/com/inframap/frontend/di/**"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
