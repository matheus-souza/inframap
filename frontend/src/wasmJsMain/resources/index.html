<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraMap</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #1e1f29; }
        #inframap-app { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background-color: #1e1f29; z-index: 9999;
            transition: opacity 0.3s ease-out;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        #loading-screen.error #loading-text { color: #ff5555; animation: none; opacity: 1; }
        #retry-btn {
            margin-top: 16px; padding: 8px 24px; border: 1px solid #bd93f9;
            background: transparent; color: #bd93f9; border-radius: 4px;
            cursor: pointer; font-family: system-ui, sans-serif; font-size: 14px;
            display: none;
        }
        #emergency-reset-btn {
            margin-top: 16px; padding: 8px 20px; border: 1px solid #ff5555;
            background: #ff555522; color: #ffb86c; border-radius: 4px;
            cursor: pointer; font-family: system-ui, sans-serif; font-size: 13px;
            display: none; transition: background 0.2s ease;
        }
        #emergency-reset-btn:hover { background: #ff555544; }
        #loading-screen.error #retry-btn { display: inline-block; }
        #retry-btn:hover { background: #bd93f933; }
        #loading-text {
            margin-top: 24px; color: #f8f8f2; font-family: system-ui, sans-serif;
            font-size: 14px; opacity: 0.7;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        #loading-text { animation: pulse 1.5s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="120" height="120">
            <path d="M40 6 L64 20 L64 46 L40 76 L16 46 L16 20 Z" fill="none" stroke="#bd93f9" stroke-width="3"/>
            <line x1="40" y1="34" x2="40" y2="6" stroke="#6272a4" stroke-width="1.8"/>
            <line x1="40" y1="34" x2="64" y2="20" stroke="#6272a4" stroke-width="1.8"/>
            <line x1="40" y1="34" x2="64" y2="46" stroke="#6272a4" stroke-width="1.8"/>
            <line x1="40" y1="34" x2="16" y2="46" stroke="#6272a4" stroke-width="1.8"/>
            <line x1="40" y1="34" x2="16" y2="20" stroke="#6272a4" stroke-width="1.8"/>
            <circle cx="40" cy="6" r="5" fill="#8be9fd"/>
            <circle cx="64" cy="20" r="5" fill="#8be9fd"/>
            <circle cx="64" cy="46" r="5" fill="#8be9fd"/>
            <circle cx="16" cy="46" r="5" fill="#8be9fd"/>
            <circle cx="16" cy="20" r="5" fill="#8be9fd"/>
            <circle cx="40" cy="34" r="8" fill="#bd93f9"/>
        </svg>
        <div id="loading-text">Carregando InfraMap...</div>
        <button id="emergency-reset-btn" onclick="window.__purgeAndReload()">⚠️ Limpar cache e reiniciar</button>
        <button id="retry-btn" onclick="location.reload()">Tentar Novamente</button>
    </div>
    <div id="inframap-app"></div>
    <script>
        window.addEventListener('error', function(event) {
            console.error('[InfraMap-Diagnostic] Unhandled Error:', event.error || event.message);
        });
        window.addEventListener('unhandledrejection', function(event) {
            console.error('[InfraMap-Diagnostic] Unhandled Promise Rejection:', event.reason);
        });
        window.addEventListener('resize', function() {
            console.log('[InfraMap-Diagnostic] Viewport resized:', window.innerWidth, 'x', window.innerHeight);
        });

        // 5s emergency reset button visibility
        setTimeout(function() {
            var screen = document.getElementById('loading-screen');
            if (screen && !screen.classList.contains('hidden')) {
                var resetBtn = document.getElementById('emergency-reset-btn');
                if (resetBtn) resetBtn.style.display = 'inline-block';
            }
        }, 5000);

        // 30s timeout
        setTimeout(function() {
            var screen = document.getElementById('loading-screen');
            if (screen && !screen.classList.contains('hidden')) {
                screen.classList.add('error');
                document.getElementById('loading-text').textContent =
                    'Falha ao carregar o InfraMap. Verifique sua conexão e tente novamente.';
            }
        }, 30000);

        window.infraMapReady = function() {
            var screen = document.getElementById('loading-screen');
            if (screen) {
                screen.classList.add('hidden');
                setTimeout(function() {
                    screen.style.display = 'none';
                }, 350);
            }
        };

        // Cache & Storage Auto-Purge Manager
        (async function() {
            var CURRENT_VERSION = "__INFRAMAP_BUILD_VERSION__";
            var STORAGE_KEY = "inframap_client_version";
            var PRESERVED_KEYS = ["theme", "user_preferences"];

            var urlParams = new URLSearchParams(window.location.search);
            var forceReset = urlParams.get('reset') === '1' || urlParams.get('purge') === '1';

            var lastVersion = null;
            try {
                lastVersion = localStorage.getItem(STORAGE_KEY);
            } catch (e) {
                console.warn("[InfraMap-Storage] LocalStorage access blocked:", e);
            }

            var isDevMode = CURRENT_VERSION === "dev" || CURRENT_VERSION.indexOf("__") !== -1;
            var versionChanged = !isDevMode && lastVersion !== null && lastVersion !== CURRENT_VERSION;

            window.__purgeAllData = async function() {
                console.warn("[InfraMap-Purge] Initiating full cache, storage, and IndexedDB purge...");

                // 1. LocalStorage
                try {
                    var preserved = {};
                    PRESERVED_KEYS.forEach(function(key) {
                        var val = localStorage.getItem(key);
                        if (val !== null) preserved[key] = val;
                    });
                    localStorage.clear();
                    Object.keys(preserved).forEach(function(key) {
                        localStorage.setItem(key, preserved[key]);
                    });
                } catch (e) {
                    console.error("[InfraMap-Purge] LocalStorage clear error:", e);
                }

                // 2. SessionStorage
                try {
                    sessionStorage.clear();
                } catch (e) {
                    console.error("[InfraMap-Purge] SessionStorage clear error:", e);
                }

                // 3. Cache Storage API
                if ('caches' in window) {
                    try {
                        var keys = await caches.keys();
                        await Promise.all(keys.map(function(k) { return caches.delete(k); }));
                        console.log("[InfraMap-Purge] Cleared Cache Storage entries:", keys.length);
                    } catch (e) {
                        console.error("[InfraMap-Purge] Cache Storage clear error:", e);
                    }
                }

                // 4. IndexedDB
                if (window.indexedDB) {
                    try {
                        if (indexedDB.databases) {
                            var dbs = await indexedDB.databases();
                            dbs.forEach(function(db) {
                                if (db.name) indexedDB.deleteDatabase(db.name);
                            });
                            console.log("[InfraMap-Purge] Cleared IndexedDB databases:", dbs.length);
                        }
                    } catch (e) {
                        console.error("[InfraMap-Purge] IndexedDB clear error:", e);
                    }
                }

                // 5. Service Workers
                if ('serviceWorker' in navigator) {
                    try {
                        var registrations = await navigator.serviceWorker.getRegistrations();
                        for (var i = 0; i < registrations.length; i++) {
                            await registrations[i].unregister();
                        }
                        console.log("[InfraMap-Purge] Unregistered Service Workers:", registrations.length);
                    } catch (e) {
                        console.error("[InfraMap-Purge] ServiceWorker unregister error:", e);
                    }
                }
            };

            window.__purgeAndReload = async function() {
                await window.__purgeAllData();
                try {
                    if (!isDevMode) localStorage.setItem(STORAGE_KEY, CURRENT_VERSION);
                } catch (e) {}
                window.location.replace(window.location.origin + window.location.pathname);
            };

            if (forceReset || versionChanged) {
                console.warn("[InfraMap-Boot] Version change or reset requested. Performing purge. Version:", CURRENT_VERSION);
                await window.__purgeAllData();
                try {
                    if (!isDevMode) localStorage.setItem(STORAGE_KEY, CURRENT_VERSION);
                } catch (e) {}
                if (forceReset) {
                    window.location.replace(window.location.origin + window.location.pathname);
                    return;
                }
            } else {
                try {
                    if (!isDevMode) localStorage.setItem(STORAGE_KEY, CURRENT_VERSION);
                } catch (e) {}
            }

            // Inject app entrypoint dynamically
            var script = document.createElement('script');
            script.src = 'inframap.js?v=' + encodeURIComponent(CURRENT_VERSION);
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
