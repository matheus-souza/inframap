name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - develop
      - main
  pull_request:
    types: [closed]
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version Tag (e.g. v1.0.0-rc.26)'
        required: false
        default: ''

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  release:
    name: Build, Scan & Publish Release Artifacts
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true) ||
      (github.event_name == 'push' &&
       (github.ref_type == 'tag' ||
        github.ref_name == 'develop' || github.ref_name == 'main')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref_name == 'develop' || github.ref_name == 'main'))
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Determine & Auto-Create Release Tag
        id: release_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --tags origin

          TARGET_BRANCH="$REF_NAME"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            TARGET_BRANCH="$BASE_REF"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ "$TARGET_BRANCH" = "develop" ]; then
            LATEST_RC=$(git tag -l "v*-rc.*" | sort -V | tail -n 1)
            if [ -z "$LATEST_RC" ]; then
              TAG="v1.0.0-rc.1"
            else
              PREFIX=$(echo "$LATEST_RC" | sed -E 's/(.*-rc\.)[0-9]+$/\1/')
              NUM=$(echo "$LATEST_RC" | sed -E 's/.*-rc\.([0-9]+)$/\1/')
              NEXT_NUM=$((NUM + 1))
              TAG="${PREFIX}${NEXT_NUM}"
            fi
            echo "Auto-generated Release Candidate Tag for develop: $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag -a "$TAG" -m "Automated release candidate $TAG"
              git push origin "$TAG"
            fi
          elif [ "$TARGET_BRANCH" = "main" ]; then
            LATEST_RC=$(git tag -l "v*-rc.*" | sort -V | tail -n 1)
            if [ -n "$LATEST_RC" ]; then
              TAG=$(echo "$LATEST_RC" | sed -E 's/-rc\.[0-9]+$//')
            else
              LATEST_RELEASE=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | grep -v '\-rc' | sort -V | tail -n 1)
              if [ -z "$LATEST_RELEASE" ]; then
                TAG="v1.0.0"
              else
                TAG="$LATEST_RELEASE"
              fi
            fi
            echo "Auto-generated Official Release Tag for main: $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag -a "$TAG" -m "Automated official release $TAG"
              git push origin "$TAG"
            fi
          else
            echo "Error: Unsupported ref $TARGET_BRANCH"
            exit 1
          fi

          if [[ "$TAG" == *$'\n'* || "$TAG" == *$'\r'* ]]; then
            echo "Error: Tag must be a single line"
            exit 1
          fi

          if ! printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$'; then
            echo "Error: Tag '$TAG' does not match semver format vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi

          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -q '\-rc'; then
            printf 'is_prerelease=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'is_prerelease=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.release_tag.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release_tag.outputs.is_prerelease == 'false' }}

      - name: Build & Push Multi-Arch Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.release_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.release_tag.outputs.tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          prerelease: ${{ steps.release_tag.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## 🚀 InfraMap Single Binary Container Release

            ### Quick Start (Homelab Docker Compose)
            ```bash
            docker run -d \
              --name inframap \
              -p 8055:8055 \
              -e DATABASE_URL="postgres://user:pass@host:5432/inframap" \
              ghcr.io/${{ github.repository }}:${{ steps.release_tag.outputs.tag }}
            ```

            Watchtower auto-update pattern supported (`ghcr.io/${{ github.repository }}:latest`).
