name: CI Quality Gates

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inframap
          POSTGRES_USER: inframap
          POSTGRES_PASSWORD: inframap_dev_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Check if backend exists
        id: check_backend
        run: |
          if [ -d "backend" ] && [ -f "backend/go.mod" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Go dependencies
        if: steps.check_backend.outputs.exists == 'true'
        run: cd backend && go mod download

      - name: Run Database Migrations
        if: steps.check_backend.outputs.exists == 'true'
        env:
          DATABASE_URL: postgres://inframap:inframap_dev_pass@localhost:5432/inframap?sslmode=disable
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          cd backend && goose -dir migrations postgres "$DATABASE_URL" up

      - name: Run Backend & E2E Tests with Coverage
        if: steps.check_backend.outputs.exists == 'true'
        env:
          DATABASE_URL: postgres://inframap:inframap_dev_pass@localhost:5432/inframap?sslmode=disable
        run: |
          cd backend
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go run scripts/format_coverage.go coverage.out > coverage_formatted.md

      - name: Publish Visual Coverage Report to Job Summary
        if: steps.check_backend.outputs.exists == 'true'
        run: cat backend/coverage_formatted.md >> $GITHUB_STEP_SUMMARY

      - name: Post/Update Code Coverage Comment on PR
        if: github.event_name == 'pull_request' && steps.check_backend.outputs.exists == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: code-coverage-report
          path: backend/coverage_formatted.md

      - name: Upload coverage to Codecov
        if: steps.check_backend.outputs.exists == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.out
          flags: backend
          name: inframap-backend-coverage
          fail_ci_if_error: false

      - name: Run golangci-lint
        if: steps.check_backend.outputs.exists == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
          install-mode: goinstall
          working-directory: ./backend
          skip-cache: true

      - name: Run Go vulnerability check (govulncheck)
        if: steps.check_backend.outputs.exists == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...

      - name: Build Production Backend Binary
        if: steps.check_backend.outputs.exists == 'true'
        run: cd backend && CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/api ./cmd/api

  verify-frontend:
    name: Verify Frontend Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -f "frontend/build.gradle.kts" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            frontend/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/**/*.gradle.kts', 'frontend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run ktlint
        if: steps.check_frontend.outputs.exists == 'true'
        run: cd frontend && ./gradlew ktlintCheck

      - name: Run detekt
        if: steps.check_frontend.outputs.exists == 'true'
        run: cd frontend && ./gradlew detekt

      - name: Run JVM tests with coverage
        if: steps.check_frontend.outputs.exists == 'true'
        run: cd frontend && ./gradlew jvmTest koverXmlReport koverVerify

      - name: Build WASM distribution
        if: steps.check_frontend.outputs.exists == 'true'
        run: cd frontend && ./gradlew wasmJsBrowserDistribution

      - name: Upload frontend coverage to Codecov
        if: steps.check_frontend.outputs.exists == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/build/reports/kover/report.xml
          flags: frontend
          name: inframap-frontend-coverage
          fail_ci_if_error: false

      - name: Upload WASM build artifacts
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-wasm-dist
          path: frontend/build/dist/wasmJs/productionExecutable/
          retention-days: 7

  e2e-frontend:
    name: Playwright Visual Regression Tests
    runs-on: ubuntu-latest
    needs: [verify, verify-frontend]
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inframap
          POSTGRES_USER: inframap
          POSTGRES_PASSWORD: inframap_dev_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://inframap:inframap_dev_pass@localhost:5432/inframap?sslmode=disable
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          cd backend && goose -dir migrations postgres "$DATABASE_URL" up

      - name: Install Playwright & Dependencies
        run: |
          cd frontend/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright Visual Regression Suite
        continue-on-error: true
        run: |
          cd frontend/e2e
          npx playwright test

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 7
